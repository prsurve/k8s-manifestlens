# Starter rules for containers in a Pod or Deployment.
id: image-latest-tag
title: Image has no fixed version
severity: warning
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  any:
    - matches: { image: '^(?!.*@).*:latest$' }
    - matches: { image: '^(?!.*@)([^/]*/)*[^/:]+$' }
report: image
message: 'Container "{container}" uses image "{value}", which has no fixed version.'
why: The "latest" tag (or no tag) points at whatever was pushed most recently. The same manifest can run different code tomorrow, and you cannot roll back to a known version.
fix: Use a specific version tag such as nginx:1.27, or an image digest (nginx@sha256:...).
---
id: missing-memory-limit
title: Container has no memory limit
severity: warning
kinds: [Pod, Deployment]
scope: container
when:
  missing: resources.limits.memory
report: resources
message: 'Container "{container}" has no memory limit.'
why: A container without a memory limit can use all the memory on its node, which can starve or crash other workloads.
fix: 'Add resources.limits.memory, for example: limits: { memory: 256Mi }.'
---
id: missing-resource-requests
title: Container has no CPU or memory request
severity: warning
kinds: [Pod, Deployment]
scope: container
when:
  any:
    - missing: resources.requests.cpu
    - missing: resources.requests.memory
report: resources
message: 'Container "{container}" does not request both CPU and memory.'
why: The scheduler uses requests to decide which node has room for the Pod. Without them it guesses, and Pods can be packed onto nodes that are too small.
fix: 'Add resources.requests.cpu and resources.requests.memory, for example: requests: { cpu: 100m, memory: 128Mi }.'
---
id: missing-readiness-probe
title: Container has no readiness probe
severity: warning
kinds: [Pod, Deployment]
scope: container
when:
  missing: readinessProbe
message: 'Container "{container}" has no readiness probe.'
why: Without a readiness probe Kubernetes sends traffic to the Pod as soon as the container starts, even if the app is not ready yet. Rolling updates can then cause failed requests.
fix: Add a readinessProbe, for example an httpGet on a health endpoint of your app.
---
id: missing-liveness-probe
title: Container has no liveness probe
severity: info
kinds: [Pod, Deployment]
scope: container
when:
  missing: livenessProbe
message: 'Container "{container}" has no liveness probe.'
why: Without a liveness probe Kubernetes only restarts the container when the process exits. A container that is stuck but still running is never restarted.
fix: Add a livenessProbe that checks the app is still responding. Keep it simple so it does not fail under load.
---
id: privileged-container
title: Container runs in privileged mode
severity: error
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  equals: { securityContext.privileged: true }
report: securityContext.privileged
message: 'Container "{container}" runs in privileged mode.'
why: A privileged container has almost the same access as a process running directly on the node. If it is compromised, the whole node is at risk.
fix: Remove privileged, or replace it with the specific capabilities the container needs under securityContext.capabilities.add.
---
id: run-as-root-user
title: Container is set to run as root
severity: error
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  any:
    - equals: { securityContext.runAsUser: 0 }
    - all:
        - equals: { $pod.securityContext.runAsUser: 0 }
        - missing: securityContext.runAsUser
report: securityContext.runAsUser
message: 'Container "{container}" is explicitly set to run as root (user 0).'
why: Root inside a container makes it much easier to attack the node if the container is compromised.
fix: Set runAsUser to a non-zero ID such as 1000 and set runAsNonRoot to true.
---
id: may-run-as-root
title: Container is not prevented from running as root
severity: warning
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  all:
    - not: { equals: { securityContext.runAsNonRoot: true } }
    - not: { equals: { $pod.securityContext.runAsNonRoot: true } }
    - not: { matches: { securityContext.runAsUser: '^[1-9][0-9]*$' } }
    - not: { matches: { $pod.securityContext.runAsUser: '^[1-9][0-9]*$' } }
report: securityContext
message: 'Container "{container}" is not prevented from running as root.'
why: Many images run as root by default. Unless you say otherwise, Kubernetes lets them.
fix: Set securityContext.runAsNonRoot to true (on the container or on the Pod), or set runAsUser to a non-zero ID.
---
id: allow-privilege-escalation
title: Container may gain extra privileges
severity: warning
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  not: { equals: { securityContext.allowPrivilegeEscalation: false } }
report: securityContext.allowPrivilegeEscalation
message: 'Container "{container}" does not disable privilege escalation.'
why: Privilege escalation lets a process gain more rights than its parent, for example through setuid programs. It is on by default.
fix: Set securityContext.allowPrivilegeEscalation to false.
---
id: writable-root-filesystem
title: Container can write to its own filesystem
severity: info
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  not: { equals: { securityContext.readOnlyRootFilesystem: true } }
report: securityContext.readOnlyRootFilesystem
message: 'Container "{container}" has a writable root filesystem.'
why: If an attacker gets into the container, a read-only filesystem stops them from dropping tools or changing the application files.
fix: Set securityContext.readOnlyRootFilesystem to true, and mount an emptyDir volume for any directory the app must write to.
---
id: capabilities-not-dropped
title: Container keeps default Linux capabilities
severity: info
kinds: [Pod, Deployment]
scope: [container, initContainer]
when:
  not: { contains: { securityContext.capabilities.drop: ALL } }
report: securityContext.capabilities
message: 'Container "{container}" does not drop all Linux capabilities.'
why: Containers start with a set of Linux capabilities most apps never use. Each one is extra attack surface.
fix: 'Set securityContext.capabilities.drop to [ALL] and add back only what the app needs.'
