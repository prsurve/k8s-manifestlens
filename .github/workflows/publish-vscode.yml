name: Publish VS Code extension

# Runs only when a tag named vscode-vX.Y.Z is pushed. The tag must match the version in
# packages/vscode/package.json and point at a commit that is on main. The tags v1.x belong to the
# GitHub Action and the project as a whole and never trigger this workflow.
#
# Authentication is VS Code Marketplace Trusted Publishing (GitHub OIDC). There is no PAT and no
# stored secret. It works only after the one-time policy described in docs/releasing-the-extension.md
# exists in the Marketplace publisher portal.
on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

# One run per tag, never cancelled midway, so a version cannot be published twice at once.
concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

env:
  VSIX_NAME: k8s-manifestlens.vsix

jobs:
  build:
    # Do not run in forks: they cannot publish and should not try.
    if: github.repository == 'prsurve/k8s-manifestlens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on main and matches the extension version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#vscode-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not of the form vscode-vX.Y.Z."
            exit 1
          fi
          pkg=$(node -p "require('./packages/vscode/package.json').version")
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag '$tag' is for version $version but packages/vscode/package.json says $pkg. Fix the version, then delete and recreate the tag."
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}( |$)" packages/vscode/CHANGELOG.md; then
            echo "::error::packages/vscode/CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$tag' points at $GITHUB_SHA, which is not on main. Merge first, then tag main."
            exit 1
          fi
          echo "Releasing extension $version from $GITHUB_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Package the extension
        run: npm run package -w k8s-manifestlens-vscode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: packages/vscode/dist/${{ env.VSIX_NAME }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Marketplace Trusted Publishing policy names this environment. Add required reviewers to it
    # in the repository settings if you want a manual approval before each publish.
    environment: marketplace
    permissions:
      contents: read
      id-token: write # lets vsce request a GitHub OIDC token; nothing else gets this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      # Installs the vsce version pinned in package-lock.json (4.1.1, which supports --oidc).
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix
      - name: Publish the exact VSIX that was built and tested
        run: npx --no-install vsce publish --oidc --packagePath "vsix/$VSIX_NAME"

  release:
    # Runs only after a successful publish. Re-running a failed release job does not publish again.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create a release or upload an asset to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vsix
      - name: Attach the VSIX to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#vscode-v}"
          file="vsix/$VSIX_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Never overwrite: if the asset is already there, leave it alone.
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$VSIX_NAME"; then
              echo "::notice::Release $tag already has $VSIX_NAME. Nothing to upload."
            else
              gh release upload "$tag" "$file"
            fi
          else
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' packages/vscode/CHANGELOG.md > notes.md
            # Not marked latest: the "Latest" release belongs to the GitHub Action (v1.x).
            gh release create "$tag" "$file" --verify-tag --latest=false \
              --title "VS Code extension $version" --notes-file notes.md
          fi
