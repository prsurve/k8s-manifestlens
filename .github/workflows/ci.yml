name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # GitHub runs packages/action/dist/index.js directly, so it is committed. Fail if it no longer
      # matches the source (run `npm run build -w @k8s-manifestlens/action` and commit the result).
      - name: Check the action bundle is up to date
        if: matrix.node == 24
        run: git diff --exit-code -- packages/action/dist
