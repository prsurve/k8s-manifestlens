apiVersion: apps/v1
kind: Deployment
metadata:
  name: risky
spec:
  template:
    spec:
      hostNetwork: true
      volumes:
        - name: host
          hostPath:
            path: /var/run
      containers:
        - name: app
          image: nginx
          securityContext:
            privileged: true
            runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: risky
spec:
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: node
spec:
  type: NodePort
