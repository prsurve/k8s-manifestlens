apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: log-shipper
          image: fluent/fluent-bit
        - name: web
          image: nginx:1.27
          env:
            - name: REGION
              value: eu
            - name: LOG_LEVEL
              value: debug
            - name: FEATURE_X
              value: "on"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 443
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: metrics
spec:
  selector:
    app: web
  ports:
    - port: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: steady
spec:
  selector:
    app: steady
  ports:
    - port: 9000
