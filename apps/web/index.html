<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ManifestLens</title>
    <meta
      name="description"
      content="Paste Kubernetes YAML and get a plain-English explanation, risky-setting warnings and a diff. Runs entirely in your browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme-init.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <h1 class="brand">ManifestLens</h1>
        <div class="tabs" role="tablist" aria-label="Mode">
          <button role="tab" id="tab-explain" aria-controls="panel-explain" data-tab="explain">
            Explain
          </button>
          <button role="tab" id="tab-check" aria-controls="panel-check" data-tab="check">
            Check
          </button>
          <button role="tab" id="tab-diff" aria-controls="panel-diff" data-tab="diff">Diff</button>
        </div>
        <p class="privacy">Runs in your browser. Nothing is uploaded.</p>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Switch to dark theme"
          title="Switch to dark theme"
        >
          <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
        <a
          class="gh"
          href="https://github.com/prsurve/manifestlens"
          rel="noopener noreferrer"
          target="_blank"
          >GitHub</a
        >
      </header>

      <main class="panels">
        <section role="tabpanel" id="panel-explain" aria-labelledby="tab-explain" class="panel">
          <div class="pane input">
            <div class="pane-head">
              <label for="explain-input">Manifest</label>
              <span class="actions">
                <button type="button" class="text-btn" data-example="explain">Load example</button>
                <button type="button" class="text-btn" data-clear="explain">Clear</button>
              </span>
            </div>
            <textarea
              id="explain-input"
              spellcheck="false"
              placeholder="Paste Kubernetes YAML here"
            ></textarea>
          </div>
          <div class="pane output" id="explain-output" aria-live="polite"></div>
        </section>

        <section role="tabpanel" id="panel-check" aria-labelledby="tab-check" class="panel" hidden>
          <div class="pane input">
            <div class="pane-head">
              <label for="check-input">Manifest</label>
              <span class="actions">
                <button type="button" class="text-btn" data-example="check">Load example</button>
                <button type="button" class="text-btn" data-clear="check">Clear</button>
              </span>
            </div>
            <textarea
              id="check-input"
              spellcheck="false"
              placeholder="Paste Kubernetes YAML here"
            ></textarea>
          </div>
          <div class="pane output" id="check-output" aria-live="polite"></div>
        </section>

        <section
          role="tabpanel"
          id="panel-diff"
          aria-labelledby="tab-diff"
          class="panel diff"
          hidden
        >
          <div class="pane input">
            <div class="pane-head">
              <label for="diff-old">Old version</label>
              <span class="actions">
                <button type="button" class="text-btn" data-example="diff">Load example</button>
                <button type="button" class="text-btn" data-clear="diff">Clear</button>
              </span>
            </div>
            <textarea id="diff-old" spellcheck="false" placeholder="Current manifest"></textarea>
            <div class="pane-head second"><label for="diff-new">New version</label></div>
            <textarea id="diff-new" spellcheck="false" placeholder="Changed manifest"></textarea>
          </div>
          <div class="pane output" id="diff-output" aria-live="polite"></div>
        </section>
      </main>

      <details class="rules">
        <summary>Your own rules (used by Check and Diff)</summary>
        <div class="rules-body">
          <p class="hint">
            Plain YAML. See the
            <a
              href="https://github.com/prsurve/manifestlens/blob/main/docs/writing-rules.md"
              rel="noopener noreferrer"
              target="_blank"
              >rule guide</a
            >.
          </p>
          <textarea
            id="extra-rules"
            spellcheck="false"
            aria-label="Your own rules"
            placeholder="id: my-rule&#10;title: ..."
          ></textarea>
          <p id="rules-error" class="error" role="alert" hidden></p>
        </div>
      </details>
    </div>
  </body>
</html>
