# .github/workflows/k8s-manifestlens.yml
name: k8s-manifestlens

on:
  pull_request:
    paths: ['k8s/**', 'deploy/**', '.github/k8s-manifestlens.yml']
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # only needed for the pull request comment
  security-events: write # only needed to upload SARIF to code scanning

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scope: new needs the base commit

      - id: lens
        uses: prsurve/k8s-manifestlens@v1
        with:
          # Project settings live in .github/k8s-manifestlens.yml. Anything set here wins over the file.
          scope: new
          fail-on: warning
          max-warnings: 3
          sarif-file: manifestlens.sarif
          # Optional: list fixes in the summary and write them as a patch. Nothing is changed.
          fix-patch-file: manifestlens-fixes.patch

      # Review the patch, then apply it locally with `git apply manifestlens-fixes.patch`.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('manifestlens-fixes.patch') != ''
        with:
          name: manifestlens-fixes
          path: manifestlens-fixes.patch

      # Show findings in the repository's Security tab as well.
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.lens.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.lens.outputs.sarif-file }}

      # Use the outputs in later steps.
      - if: always()
        run: echo "${{ steps.lens.outputs.errors }} errors, ${{ steps.lens.outputs.warnings }} warnings (${{ steps.lens.outputs.result }})"

  # One job per environment: `label` keeps each job's summary and pull request comment apart.
  environments:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
        include:
          - env: prod
            fail-on: warning # stricter in production
    steps:
      - uses: actions/checkout@v7
      - uses: prsurve/k8s-manifestlens@v1
        with:
          working-directory: deploy/${{ matrix.env }}
          label: ${{ matrix.env }}
          fail-on: ${{ matrix.fail-on || 'error' }}
          # Roll it out gradually: report everywhere except production.
          mode: ${{ matrix.env == 'prod' && 'enforce' || 'report' }}
          # If another job already annotates the same lines, turn annotations off on the report-only one.
          # annotations: false
